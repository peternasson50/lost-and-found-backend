<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="admin-dashboard.html">Admin Dashboard</a>
    <a href="browse-found.html">Browse Found Items</a>
    <a href="#" onclick="logout()">Logout</a>
</nav>

<div class="container">
    <h1>Pending Claims Review</h1>
    <p style="margin-bottom: 15px; color: #555;">
        Compare what the claimant says against the item's actual hidden details before approving.
    </p>
    <div id="claims-list">Loading...</div>
</div>

<script src="js/api.js"></script>
<script>
    requireLogin();

    if (localStorage.getItem("userRole") !== "ADMIN") {
        window.location.href = "dashboard.html";
    }

    async function loadPendingClaims() {
        const listEl = document.getElementById("claims-list");

        try {
            const claims = await apiRequest("/claims/admin/pending", "GET");

            if (claims.length === 0) {
                listEl.innerHTML = "<p>No pending claims right now.</p>";
                return;
            }

            listEl.innerHTML = claims.map(c => `
                    <div class="card">
                        <h3>${c.foundItemName}</h3>
                        <p><strong>Claimant:</strong> ${c.claimantName}</p>

                        <div style="display: flex; gap: 20px; margin-top: 10px;">
                            <div style="flex: 1; padding: 10px; background: #fdf6e3; border-radius: 4px;">
                                <strong>Claimant's answer:</strong>
                                <p>${c.proofAnswers}</p>
                            </div>
                            <div style="flex: 1; padding: 10px; background: #eafaf1; border-radius: 4px;">
                                <strong>Actual hidden details:</strong>
                                <p>IMEI: ${c.actualImei || "N/A"}</p>
                                <p>Serial: ${c.actualSerialNumber || "N/A"}</p>
                                <p>Marks: ${c.actualSpecialMarks || "N/A"}</p>
                            </div>
                        </div>

                        <p style="font-size: 12px; color: #888; margin-top: 10px;">
                            Submitted: ${new Date(c.createdAt).toLocaleString()}
                        </p>

                        <div style="margin-top: 15px;">
                            <button onclick="reviewClaim(${c.claimId}, 'approve')" style="background-color: #27ae60;">Approve</button>
                            <button onclick="reviewClaim(${c.claimId}, 'reject')" style="background-color: #c0392b; margin-left: 10px;">Reject</button>
                        </div>
                    </div>
                `).join("");
        } catch (err) {
            listEl.innerHTML = "<p class='error'>Error loading claims: " + err.message + "</p>";
        }
    }

    async function reviewClaim(claimId, action) {
        try {
            await apiRequest(`/claims/admin/${claimId}/${action}`, "PUT");
            loadPendingClaims();
        } catch (err) {
            alert("Error: " + err.message);
        }
    }

    loadPendingClaims();
</script>
</body>
</html>
